<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quản Lý Trưng Bày</title>
  <meta name="description" content="Hệ thống quản lý chương trình cho khách hàng">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QL Bán Hàng">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="QL Bán Hàng">

  <!-- Favicon & App Icons (SVG – hiển thị khi tạo lối tắt trên điện thoại) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231e1b4b'/%3E%3Cstop offset='100%25' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3ClinearGradient id='bar' x1='0%25' y1='100%25' x2='0%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23bg)'/%3E%3Crect x='18' y='58' width='14' height='24' rx='3' fill='url(%23bar)' opacity='0.85'/%3E%3Crect x='38' y='42' width='14' height='40' rx='3' fill='url(%23bar)'/%3E%3Crect x='58' y='28' width='14' height='54' rx='3' fill='url(%23bar)'/%3E%3Cpath d='M20 32 L42 22 L62 30 L80 14' fill='none' stroke='%23a5b4fc' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='80' cy='14' r='5' fill='%23fbbf24'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231e1b4b'/%3E%3Cstop offset='100%25' stop-color='%23312e81'/%3E%3C/linearGradient%3E%3ClinearGradient id='bar' x1='0%25' y1='100%25' x2='0%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23fbbf24'/%3E%3Cstop offset='100%25' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23bg)'/%3E%3Crect x='18' y='58' width='14' height='24' rx='3' fill='url(%23bar)' opacity='0.85'/%3E%3Crect x='38' y='42' width='14' height='40' rx='3' fill='url(%23bar)'/%3E%3Crect x='58' y='28' width='14' height='54' rx='3' fill='url(%23bar)'/%3E%3Cpath d='M20 32 L42 22 L62 30 L80 14' fill='none' stroke='%23a5b4fc' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='80' cy='14' r='5' fill='%23fbbf24'/%3E%3C/svg%3E">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFAULT_PRODUCTS = [
      { id: '1', name: 'Longpie 360g', qct: 8, originalPrice: 33000, netPrice: 29300, boxPriceOrg: 234700, retailPrice: 30000, boxPriceSell: 240000 },
      { id: '2', name: 'Longpie 216g', qct: 24, originalPrice: 20600, netPrice: 16500, boxPriceOrg: 395900, retailPrice: 17000, boxPriceSell: 408000 }
    ];

    const DEFAULT_PROGRAMS = [
      { id: 'PRG1', name: 'Trưng bày ', target: 10000000, reward: 500000 },
      { id: 'PRG2', name: 'Tích lũy 2 triệu ', target: 0, reward: 0 },
      { id: 'PRG3', name: 'Tích lũy 3 triệu ', target: 5000000, reward: 200000 }
    ];

    const DEFAULT_CUSTOMERS = [
      { id: 'KH01', name: 'Chị Nậm', phone: '0912 345 678', address: 'Chợ Cam Lộ, Quảng Trị', programId: 'PRG1' },
      { id: 'KH02', name: 'Anh Hùng', phone: '0988 765 432', address: '120 Hùng Vương, Đông Hà', programId: 'PRG2' }
    ];

    const formatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);

    // Tính tiền chi trả khi đạt chương trình
    // reward là số tiền cố định (VNĐ) được cài đặt trong chương trình
    // Nếu đạt chỉ tiêu → chi trả đúng số tiền đó; chưa đạt → 0
    const calculatePayout = (program, revenue) => {
      if (!program) return { amount: 0, isReached: false };
      const target = Number(program.target) || 0;
      const rewardAmount = Number(program.reward) || 0;
      if (target === 0) {
        return { amount: 0, isReached: false };
      }
      const isReached = revenue >= target;
      return {
        amount: isReached ? rewardAmount : 0,
        isReached
      };
    };

    // Modal UI Component
    function Modal({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-3 sm:p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-[fadeIn_0.2s_ease-out] max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50 flex-shrink-0">
              <h3 className="font-bold text-slate-800 text-sm sm:text-base">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-rose-500 font-bold text-xl px-2">&times;</button>
            </div>
            <div className="p-4 sm:p-5 overflow-y-auto flex-grow">
              {children}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('customers');
      
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('app_products_v5'); return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
      });
      const [programs, setPrograms] = useState(() => {
        const saved = localStorage.getItem('app_programs_v5'); return saved ? JSON.parse(saved) : DEFAULT_PROGRAMS;
      });
      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('app_customers_v5'); return saved ? JSON.parse(saved) : DEFAULT_CUSTOMERS;
      });
      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('app_orders_v5'); return saved ? JSON.parse(saved) : [];
      });
      const [toast, setToast] = useState(null);

      useEffect(() => { localStorage.setItem('app_products_v5', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('app_programs_v5', JSON.stringify(programs)); }, [programs]);
      useEffect(() => { localStorage.setItem('app_customers_v5', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('app_orders_v5', JSON.stringify(orders)); }, [orders]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type }); setTimeout(() => setToast(null), 3000);
      };

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-indigo-950 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-3 sm:px-6">
              <div className="flex items-center space-x-3 py-3 sm:py-4">
                <div className="bg-amber-400 text-indigo-950 p-2 rounded-xl font-black text-sm sm:text-lg shadow-sm">🚀</div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-lg leading-tight">Hệ Thống Quản Lý Trưng Bày</h1>
                  <p className="text-[10px] sm:text-[11px] text-indigo-200">Phiên bản tối ưu mobile & doanh số</p>
                </div>
              </div>

              <nav className="flex space-x-1 sm:space-x-2 overflow-x-auto pb-2 sm:pb-3 scrollbar-hide">
                <button onClick={() => setActiveTab('customers')} className={`flex-shrink-0 px-3 sm:px-4 py-2 rounded-t-xl font-bold text-xs transition ${activeTab === 'customers' ? 'bg-slate-50 text-indigo-950 shadow-sm' : 'bg-indigo-900 text-indigo-100 hover:bg-indigo-800'}`}>
                  👥 Khách Hàng ({customers.length})
                </button>
                <button onClick={() => setActiveTab('price_list')} className={`flex-shrink-0 px-3 sm:px-4 py-2 rounded-t-xl font-bold text-xs transition ${activeTab === 'price_list' ? 'bg-slate-50 text-indigo-950 shadow-sm' : 'bg-indigo-900 text-indigo-100 hover:bg-indigo-800'}`}>
                  🏷️ Bảng Giá ({products.length})
                </button>
                <button onClick={() => setActiveTab('orders_create')} className={`flex-shrink-0 px-3 sm:px-4 py-2 rounded-t-xl font-bold text-xs transition ${activeTab === 'orders_create' ? 'bg-slate-50 text-indigo-950 shadow-sm' : 'bg-indigo-900 text-indigo-100 hover:bg-indigo-800'}`}>
                  🛒 Lên Đơn
                </button>
                <button onClick={() => setActiveTab('analytics')} className={`flex-shrink-0 px-3 sm:px-4 py-2 rounded-t-xl font-bold text-xs transition ${activeTab === 'analytics' ? 'bg-slate-50 text-indigo-950 shadow-sm' : 'bg-indigo-900 text-indigo-100 hover:bg-indigo-800'}`}>
                  📈 Thống Kê
                </button>
              </nav>
            </div>
          </header>

          {toast && (
            <div className="fixed bottom-4 right-4 left-4 sm:left-auto z-50 animate-bounce flex justify-center">
              <div className={`px-4 py-3 rounded-xl shadow-2xl text-white font-semibold text-xs sm:text-sm flex items-center space-x-2 ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                <span>{toast.type === 'success' ? '✅' : '⚠️'}</span><span>{toast.message}</span>
              </div>
            </div>
          )}

          <main className="flex-grow max-w-7xl w-full mx-auto px-2 sm:px-6 py-4 sm:py-6">
            {activeTab === 'customers' && <CustomerTab customers={customers} setCustomers={setCustomers} programs={programs} setPrograms={setPrograms} orders={orders} setOrders={setOrders} showToast={showToast} />}
            {activeTab === 'price_list' && <PriceListTab products={products} setProducts={setProducts} showToast={showToast} />}
            {activeTab === 'orders_create' && <CreateOrderTab products={products} customers={customers} programs={programs} orders={orders} setOrders={setOrders} showToast={showToast} />}
            {activeTab === 'analytics' && <AnalyticsTab orders={orders} setOrders={setOrders} customers={customers} programs={programs} />}
          </main>
        </div>
      );
    }

    // ==========================================
    // TAB KHÁCH HÀNG & CHƯƠNG TRÌNH
    // ==========================================
    function CustomerTab({ customers, setCustomers, programs, setPrograms, orders, setOrders, showToast }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [programId, setProgramId] = useState(programs[0]?.id || '');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [showProgramModal, setShowProgramModal] = useState(false);

      const handleAddCustomer = (e) => {
        e.preventDefault();
        if (!name.trim()) return showToast('Vui lòng nhập tên!', 'error');

        const newCustomer = { id: `KH${Date.now().toString().slice(-4)}`, name, phone, address, programId };
        setCustomers([newCustomer, ...customers]);
        showToast('Đã thêm khách hàng!');
        setName(''); setPhone(''); setAddress('');
      };

      const handleUpdateCustomer = (e) => {
        e.preventDefault();
        const updated = editingCustomer;
        setCustomers(customers.map(c => c.id === updated.id ? updated : c));
        // Đồng bộ tên khách hàng mới vào tất cả đơn hàng đã lưu của khách đó
        setOrders(orders.map(o => o.customerId === updated.id ? { ...o, customerName: updated.name } : o));
        setEditingCustomer(null);
        showToast('Cập nhật thành công!');
      };

      const handleDeleteCustomer = (id) => {
        if (window.confirm('Bạn có chắc chắn muốn xóa khách hàng này?')) {
          setCustomers(customers.filter(c => c.id !== id));
          showToast('Đã xóa khách hàng!');
        }
      };

      // Quản lý chương trình
      const [newProgName, setNewProgName] = useState('');
      const [newProgTarget, setNewProgTarget] = useState(0);
      const [newProgReward, setNewProgReward] = useState(0);
      const [editingProgram, setEditingProgram] = useState(null);

      const handleAddProgram = (e) => {
        e.preventDefault();
        if (!newProgName.trim()) return;
        const newProg = {
          id: `PRG${Date.now().toString().slice(-4)}`,
          name: newProgName.trim(),
          target: Number(newProgTarget) || 0,
          reward: Number(newProgReward) || 0
        };
        setPrograms([...programs, newProg]);
        setNewProgName(''); setNewProgTarget(0); setNewProgReward(0);
        showToast('Đã thêm chương trình mới!');
      };

      const handleUpdateProgram = (e) => {
        e.preventDefault();
        setPrograms(programs.map(p => p.id === editingProgram.id ? editingProgram : p));
        setEditingProgram(null);
        showToast('Đã cập nhật chương trình!');
      };

      const handleDeleteProgram = (id, name) => {
        if (window.confirm(`Xóa chương trình "${name}"?`)) {
          setPrograms(programs.filter(p => p.id !== id));
          showToast('Đã xóa chương trình!');
        }
      };

      const getProgramName = (id) => programs.find(p => p.id === id)?.name || 'Chương trình đã xóa';

      const filteredCustomers = customers.filter(c => 
        c.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (c.phone && c.phone.includes(searchQuery))
      );

      return (
        <div className="space-y-4 sm:space-y-6">
          <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 sm:mb-5">
              <h2 className="text-base sm:text-lg font-bold text-slate-900 flex items-center space-x-2">
                <span>📝</span><span>Đăng Ký Khách Hàng Mới</span>
              </h2>
              <button onClick={() => setShowProgramModal(true)} className="w-full sm:w-auto text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl font-bold transition flex items-center justify-center space-x-1">
                <span>⚙️</span> <span>Quản lý chương trình & mức doanh số</span>
              </button>
            </div>

            <form onSubmit={handleAddCustomer} className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 text-xs sm:text-sm">
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">Tên khách hàng (*)</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} required placeholder="VD: Anh Tuấn" className="w-full bg-slate-50 border border-slate-300 p-2.5 rounded-xl outline-none" />
              </div>
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">Số điện thoại</label>
                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="VD: 0988..." className="w-full bg-slate-50 border border-slate-300 p-2.5 rounded-xl outline-none" />
              </div>
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">Địa chỉ</label>
                <input type="text" value={address} onChange={e => setAddress(e.target.value)} placeholder="Tỉnh/Thành phố..." className="w-full bg-slate-50 border border-slate-300 p-2.5 rounded-xl outline-none" />
              </div>
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">Chương trình đăng ký</label>
                <select value={programId} onChange={e => setProgramId(e.target.value)} className="w-full bg-slate-50 border border-slate-300 p-2.5 rounded-xl outline-none">
                  {programs.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div className="sm:col-span-2 pt-1">
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition">➕ Lưu Khách Hàng</button>
              </div>
            </form>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="p-3 sm:p-4 border-b border-slate-100">
              <input type="text" placeholder="🔍 Tìm kiếm theo tên hoặc số điện thoại..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 sm:px-4 py-2.5 text-xs sm:text-sm" />
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left whitespace-nowrap">
                <thead className="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase">
                  <tr>
                    <th className="py-3 px-3 sm:px-4">Mã</th>
                    <th className="py-3 px-3 sm:px-4">Tên Khách Hàng</th>
                    <th className="py-3 px-3 sm:px-4">SĐT</th>
                    <th className="py-3 px-3 sm:px-4">Địa Chỉ</th>
                    <th className="py-3 px-3 sm:px-4">Chương Trình</th>
                    <th className="py-3 px-3 sm:px-4 text-center">Thao Tác</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs font-medium">
                  {filteredCustomers.length === 0 ? (
                    <tr><td colSpan="6" className="py-6 text-center text-slate-400">Chưa có dữ liệu...</td></tr>
                  ) : (
                    filteredCustomers.map(c => (
                      <tr key={c.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3 sm:px-4 text-indigo-500 font-bold">{c.id}</td>
                        <td className="py-3 px-3 sm:px-4 text-indigo-950 font-bold">{c.name}</td>
                        <td className="py-3 px-3 sm:px-4">{c.phone || '-'}</td>
                        <td className="py-3 px-3 sm:px-4 text-slate-500">{c.address || '-'}</td>
                        <td className="py-3 px-3 sm:px-4">
                          <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-[10px] font-bold">{getProgramName(c.programId)}</span>
                        </td>
                        <td className="py-3 px-3 sm:px-4 text-center space-x-1 sm:space-x-2">
                          <button onClick={() => setEditingCustomer(c)} className="text-amber-600 bg-amber-50 px-2 py-1 rounded font-bold">✏️ Sửa</button>
                          <button onClick={() => handleDeleteCustomer(c.id)} className="text-rose-600 bg-rose-50 px-2 py-1 rounded font-bold">🗑️ Xóa</button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal Sửa Khách Hàng */}
          {editingCustomer && (
            <Modal title="Sửa Thông Tin Khách Hàng" onClose={() => setEditingCustomer(null)}>
              <form onSubmit={handleUpdateCustomer} className="space-y-3 text-xs sm:text-sm">
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">Tên khách hàng</label>
                  <input type="text" value={editingCustomer.name} onChange={e => setEditingCustomer({...editingCustomer, name: e.target.value})} required className="w-full bg-slate-50 border p-2.5 rounded-xl" />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">Số điện thoại</label>
                  <input type="text" value={editingCustomer.phone} onChange={e => setEditingCustomer({...editingCustomer, phone: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl" />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">Địa chỉ</label>
                  <input type="text" value={editingCustomer.address} onChange={e => setEditingCustomer({...editingCustomer, address: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl" />
                </div>
                <div>
                  <label className="block text-slate-600 mb-1 font-semibold">Chương trình</label>
                  <select value={editingCustomer.programId} onChange={e => setEditingCustomer({...editingCustomer, programId: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl">
                    {!programs.find(p => p.id === editingCustomer.programId) && <option value={editingCustomer.programId}>-- Đã xóa --</option>}
                    {programs.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                </div>
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl mt-2">Lưu Thay Đổi</button>
              </form>
            </Modal>
          )}

          {/* Modal Quản lý Chương Trình & Mức doanh số */}
          {showProgramModal && (
            <Modal title="Quản Lý Chương Trình & Chi Trả" onClose={() => setShowProgramModal(false)}>
              <div className="space-y-5 text-xs sm:text-sm">
                <form onSubmit={handleAddProgram} className="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200 space-y-3">
                  <h4 className="font-bold text-slate-700 text-xs uppercase">Thêm chương trình mới</h4>
                  <input type="text" value={newProgName} onChange={e => setNewProgName(e.target.value)} required placeholder="Tên chương trình (VD: Vàng, Bạc...)" className="w-full border p-2 rounded-lg bg-white" />
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[11px] mb-1 text-slate-500 font-semibold">Mức doanh số đăng ký (VNĐ)</label>
                      <input type="number" value={newProgTarget} onChange={e => setNewProgTarget(e.target.value)} min="0" className="w-full border p-2 rounded-lg bg-white" />
                    </div>
                    <div>
                      <label className="block text-[11px] mb-1 text-slate-500 font-semibold">Số tiền chi trả nếu đạt (VNĐ)</label>
                      <input type="number" value={newProgReward} onChange={e => setNewProgReward(e.target.value)} min="0" placeholder="VD: 500000" className="w-full border p-2 rounded-lg bg-white" />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold shadow-sm">Thêm Chương Trình</button>
                </form>
                
                <div className="border border-slate-100 rounded-xl overflow-hidden">
                  <ul className="divide-y divide-slate-100 max-h-60 overflow-y-auto">
                    {programs.map(p => (
                      <li key={p.id} className="p-3 hover:bg-slate-50">
                        {editingProgram?.id === p.id ? (
                          <form onSubmit={handleUpdateProgram} className="space-y-2">
                            <input type="text" value={editingProgram.name} onChange={e => setEditingProgram({...editingProgram, name: e.target.value})} className="w-full border p-1.5 rounded text-xs" required />
                            <div className="grid grid-cols-2 gap-2">
                              <div>
                                <label className="block text-[10px] text-slate-500 mb-0.5">Chỉ tiêu (VNĐ)</label>
                                <input type="number" value={editingProgram.target} onChange={e => setEditingProgram({...editingProgram, target: Number(e.target.value)})} className="w-full border p-1.5 rounded text-xs" placeholder="Doanh số" min="0" />
                              </div>
                              <div>
                                <label className="block text-[10px] text-slate-500 mb-0.5">Tiền chi trả (VNĐ)</label>
                                <input type="number" value={editingProgram.reward} onChange={e => setEditingProgram({...editingProgram, reward: Number(e.target.value)})} className="w-full border p-1.5 rounded text-xs" placeholder="Số tiền" min="0" />
                              </div>
                            </div>
                            <div className="flex justify-end space-x-2 pt-1">
                              <button type="button" onClick={() => setEditingProgram(null)} className="text-slate-500 px-3 py-1 rounded bg-slate-200 text-xs font-bold">Hủy</button>
                              <button type="submit" className="text-white px-3 py-1 rounded bg-emerald-600 text-xs font-bold">Lưu</button>
                            </div>
                          </form>
                        ) : (
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="font-bold text-slate-900 text-sm">{p.name}</span>
                              <div className="text-[11px] text-slate-500 mt-1 space-y-0.5">
                                <p>🎯 Chỉ tiêu doanh số: <span className="font-semibold text-rose-600">{formatVND(p.target)}</span></p>
                                <p>💸 Chi trả nếu đạt: <span className="font-semibold text-emerald-600">{formatVND(p.reward)}</span></p>
                              </div>
                            </div>
                            <div className="flex space-x-1 text-xs">
                              <button onClick={() => setEditingProgram({...p, reward: Number(p.reward) || 0, target: Number(p.target) || 0})} className="text-amber-600 font-bold bg-amber-50 px-2 py-1 rounded">Sửa</button>
                              <button onClick={() => handleDeleteProgram(p.id, p.name)} className="text-rose-600 font-bold bg-rose-50 px-2 py-1 rounded">Xóa</button>
                            </div>
                          </div>
                        )}
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ==========================================
    // TAB BẢNG GIÁ
    // ==========================================
    function PriceListTab({ products, setProducts, showToast }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [editingProduct, setEditingProduct] = useState(null);
      const fileInputRef = useRef(null);

      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const workbook = XLSX.read(bstr, { type: 'binary' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            let headerIndex = -1;
            for (let i = 0; i < Math.min(10, rawData.length); i++) {
              if (rawData[i] && rawData[i].includes('SẢN PHẨM')) { headerIndex = i; break; }
            }
            if (headerIndex === -1) return showToast('Không tìm thấy tiêu đề "SẢN PHẨM"!', 'error');

            const parsePrice = (val) => {
              if (val === undefined || val === null || val === '') return 0;
              let num = Number(val); return isNaN(num) ? 0 : (num < 10000 ? Math.round(num * 1000) : Math.round(num));
            };

            const importedProducts = [];
            for (let i = headerIndex + 1; i < rawData.length; i++) {
              const row = rawData[i]; if (!row || !row[1]) continue; 
              importedProducts.push({
                id: String(row[0] || `SP${i}`), name: String(row[1]), qct: row[2] || '',
                originalPrice: parsePrice(row[3]), netPrice: parsePrice(row[4]),
                boxPriceOrg: parsePrice(row[5]), retailPrice: parsePrice(row[6]), boxPriceSell: parsePrice(row[7]),
              });
            }
            setProducts(importedProducts); showToast(`Nhập thành công ${importedProducts.length} sản phẩm!`);
          } catch (err) { showToast('Lỗi đọc file Excel!', 'error'); }
        };
        reader.readAsBinaryString(file);
        e.target.value = '';
      };

      const handleUpdateProduct = (e) => {
        e.preventDefault();
        setProducts(products.map(p => p.id === editingProduct.id ? editingProduct : p));
        setEditingProduct(null); showToast('Đã cập nhật sản phẩm!');
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('Chắc chắn xóa sản phẩm này?')) {
          setProducts(products.filter(p => p.id !== id)); showToast('Đã xóa!');
        }
      };

      const filtered = products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.id.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border flex flex-col sm:flex-row justify-between gap-3">
            <div>
              <h2 className="text-base sm:text-lg font-bold text-slate-900">Dữ liệu Bảng Giá</h2>
              <p className="text-slate-500 text-xs">Cấu trúc: Sản Phẩm, QC/T, Giá gốc, Giá lẻ, Giá thùng...</p>
            </div>
            <div className="flex gap-2">
              <input type="file" ref={fileInputRef} onChange={handleExcelUpload} accept=".xlsx, .xls" className="hidden" />
              <button onClick={() => fileInputRef.current.click()} className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm">📂 Tải Excel Lên</button>
            </div>
          </div>
          <div className="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border"><input type="text" placeholder="🔍 Tìm kiếm sản phẩm..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-50 border rounded-xl px-3 sm:px-4 py-2.5 text-xs sm:text-sm" /></div>
          <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left whitespace-nowrap">
                <thead className="bg-slate-100 text-[10px] font-bold text-slate-600 uppercase tracking-wider">
                  <tr>
                    <th className="py-3 px-3 sm:px-4">TT</th>
                    <th className="py-3 px-3 sm:px-4">Sản Phẩm</th>
                    <th className="py-3 px-3 sm:px-4 text-center">QC/T</th>
                    <th className="py-3 px-3 sm:px-4 text-right">Giá Gốc</th>
                    <th className="py-3 px-3 sm:px-4 text-right bg-amber-50">Giá Lẻ</th>
                    <th className="py-3 px-3 sm:px-4 text-right bg-amber-50">Giá Thùng</th>
                    <th className="py-3 px-3 sm:px-4 text-center">Thao Tác</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs font-medium">
                  {filtered.map((p, i) => (
                    <tr key={i} className="hover:bg-slate-50">
                      <td className="py-3 px-3 sm:px-4 text-slate-500">{p.id}</td>
                      <td className="py-3 px-3 sm:px-4 font-bold text-indigo-950 truncate max-w-[150px]">{p.name}</td>
                      <td className="py-3 px-3 sm:px-4 text-center">{p.qct}</td>
                      <td className="py-3 px-3 sm:px-4 text-right text-slate-500">{formatVND(p.originalPrice)}</td>
                      <td className="py-3 px-3 sm:px-4 text-right font-black text-rose-600 bg-amber-50/30">{p.retailPrice > 0 ? formatVND(p.retailPrice) : '-'}</td>
                      <td className="py-3 px-3 sm:px-4 text-right font-black text-emerald-700 bg-amber-50/30">{p.boxPriceSell > 0 ? formatVND(p.boxPriceSell) : '-'}</td>
                      <td className="py-3 px-3 sm:px-4 text-center space-x-1 sm:space-x-2">
                        <button onClick={() => setEditingProduct(p)} className="text-amber-600 px-2 py-1 rounded bg-amber-50">✏️</button>
                        <button onClick={() => handleDeleteProduct(p.id)} className="text-rose-600 px-2 py-1 rounded bg-rose-50">🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {editingProduct && (
            <Modal title="Chỉnh Sửa Sản Phẩm" onClose={() => setEditingProduct(null)}>
              <form onSubmit={handleUpdateProduct} className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                <div className="sm:col-span-2"><label className="block mb-1 font-semibold">Tên sản phẩm</label><input type="text" value={editingProduct.name} onChange={e => setEditingProduct({...editingProduct, name: e.target.value})} required className="w-full bg-slate-50 border p-2.5 rounded-xl" /></div>
                <div><label className="block mb-1 font-semibold">Mã / TT</label><input type="text" value={editingProduct.id} onChange={e => setEditingProduct({...editingProduct, id: e.target.value})} required className="w-full bg-slate-50 border p-2.5 rounded-xl" /></div>
                <div><label className="block mb-1 font-semibold">Quy Cách / Thùng</label><input type="text" value={editingProduct.qct} onChange={e => setEditingProduct({...editingProduct, qct: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl" /></div>
                <div><label className="block mb-1 font-semibold">Giá Gốc</label><input type="number" value={editingProduct.originalPrice} onChange={e => setEditingProduct({...editingProduct, originalPrice: Number(e.target.value)})} className="w-full bg-slate-50 border p-2.5 rounded-xl" /></div>
                <div><label className="block mb-1 font-semibold">Giá Bán Lẻ</label><input type="number" value={editingProduct.retailPrice} onChange={e => setEditingProduct({...editingProduct, retailPrice: Number(e.target.value)})} className="w-full bg-rose-50 border-rose-200 p-2.5 rounded-xl text-rose-700 font-bold" /></div>
                <div className="sm:col-span-2"><label className="block mb-1 font-semibold">Giá Bán Thùng</label><input type="number" value={editingProduct.boxPriceSell} onChange={e => setEditingProduct({...editingProduct, boxPriceSell: Number(e.target.value)})} className="w-full bg-emerald-50 border-emerald-200 p-2.5 rounded-xl text-emerald-700 font-bold" /></div>
                <div className="sm:col-span-2 pt-2"><button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Lưu Sản Phẩm</button></div>
              </form>
            </Modal>
          )}
        </div>
      );
    }

    // ==========================================
    // TAB LÊN ĐƠN (Thêm giỏ hàng tạm thời)
    // ==========================================
    function CreateOrderTab({ products, customers, programs, orders, setOrders, showToast }) {
      const [customerId, setCustomerId] = useState(customers[0]?.id || '');
      const [productId, setProductId] = useState(products[0]?.id || '');
      const [unit, setUnit] = useState('Thùng');
      const [qty, setQty] = useState(1);
      
      const [tempOrders, setTempOrders] = useState([]);

      useEffect(() => { if (customers.length > 0 && !customers.find(c => c.id === customerId)) setCustomerId(customers[0].id); }, [customers]);

      const selectedCustomer = customers.find(c => c.id === customerId);
      const selectedProduct = products.find(p => p.id === productId);
      const currentPrice = selectedProduct ? (unit === 'Lẻ' ? selectedProduct.retailPrice : selectedProduct.boxPriceSell) : 0;

      const handleAddTemp = (e) => {
        e.preventDefault();
        const parsedQty = Number(qty);
        if (!selectedProduct || currentPrice === 0) return showToast('Sản phẩm chưa có giá bán!', 'error');
        if (!selectedCustomer) return showToast('Vui lòng chọn khách hàng!', 'error');
        if (isNaN(parsedQty) || parsedQty < 0.5) return showToast('Số lượng tối thiểu là 0,5!', 'error');

        const newOrder = {
          id: `DH${Date.now().toString().slice(-6)}${Math.floor(Math.random()*100)}`, 
          customerId: selectedCustomer.id, 
          customerName: selectedCustomer.name,
          productName: selectedProduct.name,
          unit, qty: parsedQty, price: currentPrice, total: Math.round(currentPrice * parsedQty),
          date: new Date().toISOString().split('T')[0]
        };

        setTempOrders([newOrder, ...tempOrders]);
        showToast('Đã thêm vào đơn tạm tính!');
        setQty(1);
      };
      
      const handleRemoveTemp = (id) => {
        setTempOrders(tempOrders.filter(o => o.id !== id));
      };
      
      const handleConfirmSave = () => {
        if(tempOrders.length === 0) return;
        setOrders([...tempOrders, ...orders]);
        setTempOrders([]);
        showToast('Đã lưu tất cả đơn hàng thành công!', 'success');
      };

      const getProgramName = (id) => programs.find(p => p.id === id)?.name || '';
      
      const totalTempAmount = tempOrders.reduce((sum, o) => sum + o.total, 0);

      return (
        <div className="space-y-4 max-w-2xl mx-auto">
          {/* Box Lên Đơn */}
          <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div className="flex items-center space-x-2 mb-4 sm:mb-6"><span className="text-xl">✍️</span><h2 className="text-base sm:text-lg font-bold text-slate-900">Lên Đơn Hàng Mới</h2></div>
            <form onSubmit={handleAddTemp} className="space-y-3 sm:space-y-4 text-xs sm:text-sm font-medium">
              <div>
                <label className="block text-slate-600 mb-1">Khách hàng</label>
                <select value={customerId} onChange={e => setCustomerId(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl">
                  {customers.length === 0 && <option value="">-- Chưa có KH --</option>}
                  {customers.map(c => <option key={c.id} value={c.id}>{c.name} - {getProgramName(c.programId)}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-slate-600 mb-1">Chọn Sản Phẩm</label>
                <select value={productId} onChange={e => setProductId(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl">
                  {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-3 sm:gap-4">
                <div>
                  <label className="block text-slate-600 mb-1">Hình thức bán</label>
                  <select value={unit} onChange={e => setUnit(e.target.value)} className="w-full bg-slate-50 border p-2.5 rounded-xl">
                    <option value="Thùng">Bán Thùng</option>
                    <option value="Lẻ">Bán Lẻ</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-600 mb-1">Số lượng (tối thiểu 0,5)</label>
                  <input 
                    type="number" 
                    step="0.5" 
                    min="0.5" 
                    value={qty} 
                    onChange={e => setQty(e.target.value)} 
                    className="w-full bg-slate-50 border p-2.5 rounded-xl" 
                  />
                </div>
              </div>
              <div className="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200">
                <div className="flex justify-between text-slate-500 mb-1 text-xs"><span>Đơn giá ({unit}):</span><span>{formatVND(currentPrice)}</span></div>
                <div className="flex justify-between font-black text-base sm:text-lg text-indigo-950 border-t pt-2 mt-2"><span>Tạm tính (chưa lưu):</span><span className="text-emerald-600">{formatVND(currentPrice * (Number(qty) || 0))}</span></div>
              </div>
              <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl shadow transition">➕ Thêm Vào Đơn Tạm Tính</button>
            </form>
          </div>
          
          {/* Box Đơn Tạm Tính */}
          {tempOrders.length > 0 && (
            <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 animate-[fadeIn_0.3s_ease-out]">
              <h3 className="text-base font-bold text-slate-900 mb-4 flex items-center space-x-2"><span>🛒</span><span>Đơn Tạm Tính ({tempOrders.length})</span></h3>
              <div className="overflow-x-auto mb-4">
                <table className="w-full text-left whitespace-nowrap">
                  <thead className="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase">
                    <tr>
                      <th className="py-2 px-3">Sản Phẩm</th>
                      <th className="py-2 px-3 text-center">SL</th>
                      <th className="py-2 px-3 text-right">Thành Tiền</th>
                      <th className="py-2 px-3 text-center">Bỏ</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-xs font-medium">
                    {tempOrders.map(o => (
                      <tr key={o.id} className="hover:bg-slate-50">
                        <td className="py-2 px-3">{o.productName} <span className="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded ml-1">{o.unit}</span></td>
                        <td className="py-2 px-3 text-center font-bold">{o.qty}</td>
                        <td className="py-2 px-3 text-right text-emerald-600 font-bold">{formatVND(o.total)}</td>
                        <td className="py-2 px-3 text-center">
                          <button onClick={() => handleRemoveTemp(o.id)} className="text-rose-400 hover:text-rose-600 font-bold text-sm">❌</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              
              {/* Tổng doanh số đơn tạm tính */}
              <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-5">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1 sm:gap-0">
                  <span className="font-bold text-emerald-900 text-sm">Tổng doanh số đơn tạm tính:</span>
                  <span className="font-black text-xl text-emerald-700">{formatVND(totalTempAmount)}</span>
                </div>
              </div>

              <button onClick={handleConfirmSave} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow transition flex justify-center items-center space-x-2">
                <span>✅</span><span>Xác Nhận Lưu Đơn Hàng</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TAB THỐNG KÊ (Sửa ngày lên đơn)
    // ==========================================
    function AnalyticsTab({ orders, setOrders, customers, programs }) {
      const [filterCustId, setFilterCustId] = useState('all');
      const [filterMonth, setFilterMonth] = useState('all');
      
      const [editingOrderId, setEditingOrderId] = useState(null);
      const [editDate, setEditDate] = useState('');

      const availableMonths = useMemo(() => Array.from(new Set(orders.map(o => o.date.substring(0, 7)))).sort().reverse(), [orders]);
      
      const filteredOrders = useMemo(() => orders.filter(o => {
        const matchCust = filterCustId === 'all' || o.customerId === filterCustId;
        const matchMonth = filterMonth === 'all' || o.date.startsWith(filterMonth);
        return matchCust && matchMonth;
      }), [orders, filterCustId, filterMonth]);
      
      const totalRevenue = filteredOrders.reduce((sum, o) => sum + o.total, 0);

      // Gom doanh số theo từng customerId từ filteredOrders
      const revenueByCustomer = useMemo(() => {
        const map = {};
        filteredOrders.forEach(o => {
          map[o.customerId] = (map[o.customerId] || 0) + o.total;
        });
        return map;
      }, [filteredOrders]);

      // Tổng tiền chi trả luôn hiển thị (cộng dồn theo từng khách đạt chỉ tiêu)
      const totalPayoutAmount = useMemo(() => {
        let sum = 0;
        Object.keys(revenueByCustomer).forEach(custId => {
          const cust = customers.find(c => c.id === custId);
          if (!cust) return;
          const prog = programs.find(p => p.id === cust.programId);
          if (!prog) return;
          const payout = calculatePayout(prog, revenueByCustomer[custId]);
          sum += payout.amount;
        });
        return sum;
      }, [revenueByCustomer, customers, programs]);

      const handleSaveDate = (id) => {
        if(editDate) {
          setOrders(orders.map(o => o.id === id ? { ...o, date: editDate } : o));
        }
        setEditingOrderId(null);
      };

      // Khi chọn 1 khách hàng cụ thể → vẫn hiện card tiến độ chi tiết
      let progressCard = null;
      if (filterCustId !== 'all') {
        const selCust = customers.find(c => c.id === filterCustId);
        if (selCust) {
          const custProg = programs.find(p => p.id === selCust.programId);
          if (custProg) {
            const custRevenue = revenueByCustomer[filterCustId] || 0;
            const payout = calculatePayout(custProg, custRevenue);
            const missing = (Number(custProg.target) || 0) - custRevenue;
            
            progressCard = (
              <div className={`p-4 sm:p-5 rounded-2xl shadow-sm border ${payout.isReached && custProg.target > 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-slate-200'} mt-3 sm:mt-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3`}>
                <div>
                  <h3 className="font-bold text-slate-800 text-xs sm:text-sm">Chương trình: <span className="text-indigo-700">{custProg.name}</span></h3>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">Chỉ tiêu doanh số: <span className="font-semibold">{formatVND(custProg.target)}</span></p>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">Số tiền chi trả nếu đạt: <span className="font-semibold text-emerald-700">{formatVND(custProg.reward)}</span></p>
                </div>
                
                <div className="w-full sm:w-auto text-left sm:text-right pt-2 sm:pt-0 border-t sm:border-0 border-slate-200">
                  {custProg.target === 0 ? (
                    <span className="text-slate-500 text-xs sm:text-sm font-medium italic">Không có chỉ tiêu doanh số</span>
                  ) : payout.isReached ? (
                    <div>
                      <span className="bg-emerald-500 text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm inline-block">Đạt</span>
                      <p className="text-xs sm:text-sm font-bold text-emerald-700 mt-1.5">
                        Tiền chi trả: {formatVND(payout.amount)}
                      </p>
                    </div>
                  ) : (
                    <div>
                      <span className="bg-rose-100 text-rose-700 px-3 py-1 rounded-full text-xs font-bold shadow-sm inline-block">Chưa đủ</span>
                      <p className="text-xs sm:text-sm font-semibold text-rose-600 mt-1.5">Doanh số còn thiếu: {formatVND(missing)}</p>
                      <p className="text-xs sm:text-sm font-semibold text-slate-500 mt-1">Tiền chi trả: 0 ₫</p>
                    </div>
                  )}
                </div>
              </div>
            );
          }
        }
      }

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div>
              <label className="block text-[11px] sm:text-xs font-bold text-slate-500 mb-1 uppercase">Khách Hàng (Đã Đăng Ký)</label>
              <select value={filterCustId} onChange={(e) => setFilterCustId(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 sm:px-4 py-2.5 text-xs sm:text-sm font-medium">
                <option value="all">-- Tất cả khách hàng --</option>
                {customers.map(c => <option key={c.id} value={c.id}>{c.name} ({c.phone || c.id})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-[11px] sm:text-xs font-bold text-slate-500 mb-1 uppercase">Tháng / Năm</label>
              <select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 sm:px-4 py-2.5 text-xs sm:text-sm font-medium">
                <option value="all">Tất cả thời gian</option>
                {availableMonths.map(m => <option key={m} value={m}>Tháng {m.split('-')[1]} năm {m.split('-')[0]}</option>)}
              </select>
            </div>
          </div>

          {/* Tổng Doanh Thu + Tổng tiền chi trả nằm cạnh nhau */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div className="bg-indigo-950 text-white p-5 sm:p-6 rounded-2xl shadow-lg relative overflow-hidden">
              <div className="absolute right-[-16px] top-[-16px] text-6xl sm:text-7xl opacity-10">💰</div>
              <p className="text-indigo-200 font-bold text-xs sm:text-sm">Tổng Doanh Thu</p>
              <h2 className="text-xl sm:text-3xl font-black mt-2 text-amber-400">{formatVND(totalRevenue)}</h2>
              <p className="text-[11px] sm:text-xs text-indigo-200 mt-2">{filteredOrders.length} đơn hàng{filterMonth !== 'all' ? ' trong tháng' : ''}.</p>
            </div>

            <div className="bg-emerald-600 text-white p-5 sm:p-6 rounded-2xl shadow-lg relative overflow-hidden">
              <div className="absolute right-[-16px] top-[-16px] text-6xl sm:text-7xl opacity-10">💸</div>
              <p className="text-emerald-100 font-bold text-xs sm:text-sm">
                Tổng tiền đã chi trả {filterMonth !== 'all' ? 'trong tháng' : 'trong kỳ'}
              </p>
              <h2 className="text-xl sm:text-3xl font-black mt-2 text-white">
                {totalPayoutAmount > 0 ? formatVND(totalPayoutAmount) : '0 ₫'}
              </h2>
              <p className="text-[11px] sm:text-xs text-emerald-100 mt-2">
                {filterCustId === 'all'
                  ? 'Cho tất cả khách đạt chỉ tiêu'
                  : (totalPayoutAmount > 0 ? 'Đã đạt chỉ tiêu' : 'Chưa đạt chỉ tiêu')}
              </p>
            </div>
          </div>

          {progressCard}

          <div className="bg-white rounded-2xl shadow-sm border overflow-hidden mt-2">
            <div className="overflow-x-auto">
              <table className="w-full text-left whitespace-nowrap">
                <thead className="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase">
                  <tr>
                    <th className="py-3 px-3 sm:px-4">Mã Đơn</th>
                    <th className="py-3 px-3 sm:px-4">Ngày Lên Đơn</th>
                    <th className="py-3 px-3 sm:px-4">Khách Hàng</th>
                    <th className="py-3 px-3 sm:px-4">Sản Phẩm</th>
                    <th className="py-3 px-3 sm:px-4 text-center">SL</th>
                    <th className="py-3 px-3 sm:px-4 text-right">Thành Tiền</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs font-medium">
                  {filteredOrders.length === 0 ? <tr><td colSpan="6" className="py-8 text-center text-slate-400">Chưa có dữ liệu...</td></tr> : filteredOrders.map(o => (
                    <tr key={o.id} className="hover:bg-slate-50">
                      <td className="py-3 px-3 sm:px-4 text-indigo-600 font-bold">{o.id}</td>
                      <td className="py-3 px-3 sm:px-4">
                        {editingOrderId === o.id ? (
                          <div className="flex items-center space-x-1">
                            <input type="date" value={editDate} onChange={e => setEditDate(e.target.value)} className="border border-slate-300 rounded px-1.5 py-1 text-xs bg-white text-slate-800" />
                            <button onClick={() => handleSaveDate(o.id)} className="text-emerald-600 hover:bg-emerald-50 rounded px-1.5 py-1">💾</button>
                            <button onClick={() => setEditingOrderId(null)} className="text-rose-500 hover:bg-rose-50 rounded px-1.5 py-1">❌</button>
                          </div>
                        ) : (
                          <div className="flex items-center space-x-2 text-slate-500">
                            <span>{o.date}</span>
                            <button onClick={() => { setEditingOrderId(o.id); setEditDate(o.date); }} className="text-slate-400 hover:text-amber-500 transition">✏️</button>
                          </div>
                        )}
                      </td>
                      <td className="py-3 px-3 sm:px-4 font-bold">{o.customerName}</td>
                      <td className="py-3 px-3 sm:px-4">{o.productName} <span className="text-[10px] bg-slate-200 px-1.5 py-0.5 rounded ml-1">{o.unit}</span></td>
                      <td className="py-3 px-3 sm:px-4 text-center font-bold">{o.qty}</td>
                      <td className="py-3 px-3 sm:px-4 text-right font-black text-emerald-600">{formatVND(o.total)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(rootEl = document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
